name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /opencode') ||
      startsWith(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config --global user.email "opencode@users.noreply.github.com"
          git config --global user.name "opencode[bot]"

      - name: Checkout PR branch if comment is on a pull request
        if: github.event.issue.pull_request
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_REF=$(gh pr view "${{ github.event.issue.number }}" \
            --json headRefName --jq .headRefName)
          git fetch origin "$HEAD_REF"
          git checkout "$HEAD_REF"

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/deepseek-v4-flash-free
          use_github_token: true
          prompt: |
            Always use Conventional Commits format for all commit messages: type(scope): description.
            Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
            Scope is optional but encouraged (e.g. backend, frontend, typespec, infra).