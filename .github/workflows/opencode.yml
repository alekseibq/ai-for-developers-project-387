name: opencode

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: true

env:
  MAX_HOURLY_RUNS: ${{ vars.MAX_HOURLY_RUNS || 20 }}
  MAX_DAILY_RUNS: ${{ vars.MAX_DAILY_RUNS || 100 }}

jobs:
  rate-limit-check:
    if: |
      (contains(github.event.comment.body, ' /oc') ||
       startsWith(github.event.comment.body, '/oc') ||
       contains(github.event.comment.body, ' /opencode') ||
       startsWith(github.event.comment.body, '/opencode')) &&
      github.actor != 'github-actions[bot]' &&
      github.actor != 'opencode[bot]'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check rate limit
        id: check
        run: |
          HOURLY_LIMIT="${{ env.MAX_HOURLY_RUNS }}"
          DAILY_LIMIT="${{ env.MAX_DAILY_RUNS }}"

          echo "Checking rate limits (hourly: $HOURLY_LIMIT, daily: $DAILY_LIMIT)..."

          NOW=$(date -u +%s)
          ONE_HOUR_AGO=$((NOW - 3600))
          ONE_DAY_AGO=$((NOW - 86400))

          RUNS=$(gh run list --workflow opencode.yml --limit 100 --json createdAt,conclusion --jq '.[] | select(.conclusion == "success" or .conclusion == "failure") | .createdAt')

          HOURLY_COUNT=0
          DAILY_COUNT=0

          while IFS= read -r DATE; do
            [ -z "$DATE" ] && continue
            TS=$(date -d "$DATE" -u +%s 2>/dev/null || echo 0)
            [ "$TS" -ge "$ONE_DAY_AGO" ] && DAILY_COUNT=$((DAILY_COUNT + 1))
            [ "$TS" -ge "$ONE_HOUR_AGO" ] && HOURLY_COUNT=$((HOURLY_COUNT + 1))
          done <<< "$RUNS"

          echo "hourly_count=$HOURLY_COUNT (limit: $HOURLY_LIMIT)"
          echo "daily_count=$DAILY_COUNT (limit: $DAILY_LIMIT)"

          if [ "$HOURLY_COUNT" -ge "$HOURLY_LIMIT" ] || [ "$DAILY_COUNT" -ge "$DAILY_LIMIT" ]; then
            echo "allowed=false" >> "$GITHUB_OUTPUT"

            EXCEEDED=""
            [ "$HOURLY_COUNT" -ge "$HOURLY_LIMIT" ] && EXCEEDED="hourly ($HOURLY_COUNT / $HOURLY_LIMIT)"
            [ "$DAILY_COUNT" -ge "$DAILY_LIMIT" ] && EXCEEDED="${EXCEEDED}daily ($DAILY_COUNT / $DAILY_LIMIT)"

            gh issue create \
              --title "\u26a0\ufe0f Rate limit exceeded" \
              --label "cost-control" \
              --body "Workflow run #${{ github.run_id }} was blocked.

        **Exceeded limit**: $EXCEEDED
        **Repository**: ${{ github.repository }}
        **Trigger**: ${{ github.event_name }}
        **Workflow URL**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --repo "${{ github.repository }}" 2>/dev/null || echo "Warning: could not create alert issue"

            echo "Rate limit exceeded: $EXCEEDED. Workflow blocked."
            exit 1
          fi

          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Rate limit OK. Proceeding."

  opencode:
    needs: rate-limit-check
    if: needs.rate-limit-check.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Always use Conventional Commits format for all commit messages: type(scope): description.
            Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert.
            Scope is optional but encouraged (e.g. backend, frontend, typespec, infra).

  explain-issue:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run opencode to explain issue
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            A new issue has been created. Analyze the issue and post a comment explaining:
            - What the issue is about
            - What needs to be done
            - Any relevant context from the codebase
            - Potential approaches or areas to investigate

            Issue #${{ github.event.issue.number }}: ${{ github.event.issue.title }}

            ${{ github.event.issue.body }}
