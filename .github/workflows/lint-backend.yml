name: lint-backend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install poetry
      - run: cd backend && poetry install
      - run: cd backend && poetry run ruff check .
      - run: cd backend && poetry run mypy app/
