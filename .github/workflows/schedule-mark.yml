name: schedule-mark

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/v1/schedule-mark
        env:
          API_URL: ${{ vars.API_URL || 'http://localhost:8000' }}
        run: |
          response=$(curl -sf "$API_URL/api/v1/schedule-mark")
          echo "schedule-mark response: $response"
